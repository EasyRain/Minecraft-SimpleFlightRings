# SimpleFlightRing 的 AccessTransformer
#
# 极光天空（AuroraSky）需要"与画面 FOV 一致、但不带走路摇晃"的投影矩阵来画无限远的天空体：
# GameRenderer#getFov(Camera, float, boolean) 是唯一携带全部有效 FOV 状态
# （疾跑/潜行/缩放等修正的插值）的入口，但它与 GameRenderer#getProjectionMatrix 不同，是 private —— 开放之。
# 用法：gameRenderer.getProjectionMatrix(gameRenderer.getFov(camera, partialTick, true)) == 未折叠
# bobHurt/bobView/反胃摇晃的"干净投影"（对照 GameRenderer#renderLevel 的折叠顺序）。
public net.minecraft.client.renderer.GameRenderer getFov(Lnet/minecraft/client/Camera;FZ)D
